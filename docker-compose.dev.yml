# ============================================================
# Family Tree – DEVELOPMENT overrides
#
# Merged on top of docker-compose.yml. With COMPOSE_FILE set in .env
# (see .env.example) this happens automatically:
#
#   docker compose up --build
#
# Adds: hot reload (air / next dev), bind-mounted sources,
# exposed Postgres/API/frontend ports, relaxed cookies.
# ============================================================

services:
  postgres:
    restart: "no"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: dev
    restart: "no"
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - backend_go_cache:/go/pkg/mod
      - uploads_data:/app/uploads
    healthcheck:
      # First build inside the container takes a while
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: "no"
    environment:
      NODE_ENV: development
      # Next.js rewrites /api/* and /uploads/* to this address (same-origin dev proxy)
      API_PROXY_TARGET: http://backend:8080
      # Reliable file watching on Windows/macOS bind mounts
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Keep container-installed dependencies; do not shadow with host files.
      # After changing package.json: docker compose build frontend && docker compose up -V frontend
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    healthcheck:
      start_period: 60s

volumes:
  postgres_data_dev:
  backend_go_cache:
  frontend_node_modules:
  frontend_next_cache:
