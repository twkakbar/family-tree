# Family Tree – reverse proxy virtual host.
#
# Routing:
#   /api/*      -> backend  (Go API)
#   /uploads/*  -> shared volume (static files written by the backend)
#   everything  -> frontend (Next.js)
#
# This file is the HTTP server baked into the image (local Docker and dev).
# Production replaces it via docker-compose.prod.yml
# (docker/nginx/prod.conf.d/default.conf): HTTPS for twkakbar.my.id.

# Docker's embedded DNS. Using variables in proxy_pass forces re-resolution,
# so nginx survives backend/frontend container restarts without a reload.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/conf.d/security-headers.inc;

    # --- Health probes (backend) ------------------------------
    location = /healthz {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        access_log off;
    }
    location = /readyz {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        access_log off;
    }

    # --- API ------------------------------------------------
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Stricter rate limit for login/register/refresh
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Uploaded files (read-only volume) -------------------
    # root (not alias) to avoid the alias/try_files pitfall:
    # file path = /var/www + URI = /var/www/uploads/<file>
    location /uploads/ {
        root /var/www;
        expires 7d;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- Next.js (pages, static assets, HMR websocket in dev) ---
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
