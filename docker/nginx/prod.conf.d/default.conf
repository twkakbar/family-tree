# Production vhost. Mounted over the image's default.conf by
# docker-compose.prod.yml. Do not copy this into conf.d/ — Nginx would
# load it in development too, and local Docker has no certificate.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name twkakbar.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://twkakbar.my.id$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name twkakbar.my.id;

    ssl_certificate     /etc/letsencrypt/live/twkakbar.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twkakbar.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/security-headers.inc;
    include /etc/nginx/conf.d/security-headers-tls.inc;

    location = /healthz {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        access_log off;
    }
    location = /readyz {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        access_log off;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;

        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        root /var/www;
        expires 7d;
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/security-headers-tls.inc;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
