# Continuous Integration: every push to main and every pull request.
# Jobs mirror the local Definition of Done (DEVELOPMENT_RULES.md §8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files need gofmt:"; echo "$UNFORMATTED"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test -race -cover ./...

      - name: Build binaries
        run: go build ./...

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    # Image builds are the slowest check; gate merges to main only.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  e2e:
    name: E2E smoke (Playwright + Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 45
    env:
      NGINX_HTTP_PORT: "8088"
      BASE_URL: http://127.0.0.1:8088
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env for production compose
        run: |
          printf '%s\n' \
            'COMPOSE_FILE=docker-compose.yml' \
            'BACKEND_IMAGE=family-tree/backend:local' \
            'FRONTEND_IMAGE=family-tree/frontend:local' \
            'NGINX_IMAGE=family-tree/nginx:local' \
            'NGINX_HTTP_PORT=8088' \
            'POSTGRES_USER=familytree' \
            'POSTGRES_PASSWORD=ci-postgres-password' \
            'POSTGRES_DB=familytree' \
            'JWT_SECRET=ci-only-secret-change-me-min-32-characters!!' \
            'COOKIE_SECURE=false' \
            'RUN_MIGRATIONS=true' \
            'LOG_LEVEL=info' \
            'ADMIN_EMAIL=ci-admin@example.com' \
            'ADMIN_PASSWORD=ci-admin-password-1' \
            'ADMIN_NAME=CI Admin' \
            'ROYAL_FAMILY_NAME=Kesultanan Aceh' \
            > .env

      - name: Start stack
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/readyz" | grep -q '"status":"ok"'; then
              echo "ready after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=80
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run smoke tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
