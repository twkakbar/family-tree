# Continuous Delivery: build & push images to Docker Hub on version tags,
# then optionally deploy to the VM over SSH.
#
# Required to push images:
#   Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token)
# Required to enable the deploy job (see docs/DEPLOYMENT.md):
#   Repository variable  DEPLOY_ENABLED = "true"
#   Repository variable  DEPLOY_PATH    = e.g. /opt/family-tree
#   Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key), optional DEPLOY_PORT
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  BACKEND_IMAGE: twkakbar/family-tree-backend
  FRONTEND_IMAGE: twkakbar/family-tree-frontend
  NGINX_IMAGE: twkakbar/family-tree-nginx

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: docker/nginx
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.NGINX_IMAGE }}:latest

  deploy:
    name: Deploy to VM
    needs: build-push
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH }}"
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d
            docker image prune -f
