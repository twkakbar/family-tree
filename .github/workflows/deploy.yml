# Continuous delivery.
#
# After CI succeeds on main, build the production images in GitHub Actions,
# push them to GHCR, then SSH to the VM and pull. The VM does not compile.
#
# Registry is GHCR (not Docker Hub) so Actions can push with GITHUB_TOKEN.
# Images are made public after publish so the VM can pull without a PAT.
# See ADR-0011 and docs/DEPLOYMENT.md.
#
# Required to deploy:
#   Variable DEPLOY_ENABLED = "true"
#   Variable DEPLOY_PATH    = /opt/family-tree
#   Secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/twkakbar

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "version=sha-${sha::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/family-tree-backend:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/family-tree-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/twkakbar/family-tree
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/family-tree-frontend:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/family-tree-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/twkakbar/family-tree
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: docker/nginx
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/family-tree-nginx:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/family-tree-nginx:latest
          labels: |
            org.opencontainers.image.source=https://github.com/twkakbar/family-tree

      - name: Make packages public so the VM can pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in family-tree-backend family-tree-frontend family-tree-nginx; do
            code=$(curl -sS -o /tmp/pkg.json -w "%{http_code}" -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/user/packages/container/${name}" \
              -d '{"visibility":"public"}')
            echo "${name}: HTTP ${code}"
            if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
              echo "Could not mark ${name} public. The VM pull will fail until it is public."
              cat /tmp/pkg.json
              exit 1
            fi
          done

  deploy:
    name: Deploy to VM
    needs: build-push
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH }}"
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD
            sed -i 's|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}/family-tree-backend:latest|' .env
            sed -i 's|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}/family-tree-frontend:latest|' .env
            sed -i 's|^NGINX_IMAGE=.*|NGINX_IMAGE=${{ env.IMAGE_PREFIX }}/family-tree-nginx:latest|' .env
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            sudo docker image prune -f
