# air – live reload for the dev container (and native dev if you use air).
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "./tmp/api"
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "uploads", "bin"]
exclude_regex = ["_test\\.go$"]
delay = 200

[log]
main_only = true

[misc]
clean_on_exit = true
